openapi: 3.0.4
info:
  title: Y social
  description: Social media incentrato su messaggi vocali
  version: '1.0'
servers:
- url: http://localhost:8081/api
paths:
  /user/{id}:
    parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    get:
      description: Returns a user
      responses:
        "200":
          description: User data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Post non esiste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      description: Update a user
      parameters:
        - name: userData
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
            description: User updated succesfully.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/User"
        "404":
            description: User id not found.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
  "/post":
    get:
      description: Returns all posts
      responses:
        '200':
          description: A list of posts.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Post"
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    UserUpdate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Post:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
