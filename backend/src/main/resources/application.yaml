spring:
  application:
    name: y-backend
  datasource:
    url: jdbc:postgresql://db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    servlet:
      multipart:
        enabled: true
        max-file-size: 20MB
        max-request-size: 20MB
  sql:
    init:
      mode: ALWAYS
  logging:
    level:
      root: INFO
      org:
        springframework: INFO
        hibernate:
          validator: ERROR
      io:
        jsonwebtoken: WARN
  ouput:
    ansi:
      enabled: ALWAYS
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: 3600000
file-storage:
  audio: ${FILE_UPLOAD_DIR}